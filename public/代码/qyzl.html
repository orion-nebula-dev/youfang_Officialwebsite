<body data-page="disclosure"><div id="site-header"></div><main><section class="page-hero"><div class="hero-media" data-asset-bg="hero-mountain"></div><div class="container hero-content"><div><p class="hero-kicker">GOVERNANCE</p><h1 class="hero-title">企业治理</h1><p class="page-crumbs"><a href="index.html">首页</a>　/　企业治理</p></div></div></section><section class="section"><div class="container"><div class="section-head"><p class="eyebrow">GOVERNANCE PRINCIPLES</p><h2 class="section-title">清晰的边界，让协作更有效</h2><p class="section-summary">所有对外主张都以可核对信息与正式确认口径为基础。</p></div><div class="content-grid"><article class="info-card"><div class="card-number">01</div><h3>事实优先</h3><p>只使用已确认的品牌、产品与设计信息；不把视觉稿中的模糊数字当作正式经营数据。</p></article><article class="info-card"><div class="card-number">02</div><h3>状态分层</h3><p>明确区分已上线、试点中和规划中的内容，避免误导加盟商和合作伙伴。</p></article><article class="info-card"><div class="card-number">03</div><h3>责任清晰</h3><p>费用、收益、周期、城市开放与合同信息，按正式确认口径对外发布。</p></article></div></div></section><section class="section section--soft"><div class="container"><div class="quote">让信息更容易被理解，让每一个承诺都有正式来源。</div></div></section></main><div id="site-footer"></div><button class="back-top" type="button" aria-label="返回顶部">↑</button><script src="js/data.js?v=20260831"></script><script src="js/site.js?v=20260829"></script></body></html>
